# ==============================================================================
# Production-Grade Woodpecker CI Configuration (.woodpecker.yml)
# Target Toolchain: Rust 1.98.0 / Cargo 1.98.0 (2026-08)
# ==============================================================================

# Woodpecker pipelines execute steps sequentially within a matrix container,
# or in parallel DAG steps via depends_on nodes.

when:
  event: [push, pull_request]
  branch: [main, master]

matrix:
  include:
    - RUST_VERSION: "1.98.0"

steps:
  # ----------------------------------------------------------------------------
  # Code Formatting
  # ----------------------------------------------------------------------------
  fmt:
    image: rust:1.98.0-slim-bookworm
    commands:
      - rustup component add rustfmt
      - cargo fmt --workspace --check

  # ----------------------------------------------------------------------------
  # Static Analysis & Lints
  # ----------------------------------------------------------------------------
  clippy:
    image: rust:1.98.0-bookworm
    depends_on: [fmt]
    commands:
      - apt-get update && apt-get install -y mold clang
      - rustup component add clippy
      - cargo clippy --workspace --all-targets --all-features -- -D warnings

  # ----------------------------------------------------------------------------
  # Dependency Security & License Auditing
  # ----------------------------------------------------------------------------
  deny:
    image: rust:1.98.0-slim-bookworm
    depends_on: [fmt]
    commands:
      - apt-get update && apt-get install -y wget
      # Downloads pre-compiled binary to avoid compiling cargo-deny from source
      - wget -qO- https://github.com/EmbarkStudios/cargo-deny/releases/download/0.16.1/cargo-deny-0.16.1-x86_64-unknown-linux-musl.tar.gz | tar xz -C /usr/local/bin --strip-components=1
      - cargo deny check

  # ----------------------------------------------------------------------------
  # Parallel Test & Cross-Check Steps
  # ----------------------------------------------------------------------------
  test:
    image: rust:1.98.0-bookworm
    depends_on: [clippy, deny]
    commands:
      - apt-get update && apt-get install -y mold clang wget
      - wget -qO- https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.72/cargo-nextest-0.9.72-x86_64-unknown-linux-musl.tar.gz | tar xz -C /usr/local/bin
      - cargo nextest run --profile ci --workspace --all-targets
      - cargo test --doc --workspace

  check-targets:
    image: rust:1.98.0-bookworm
    depends_on: [clippy, deny]
    commands:
      - rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-gnu wasm32-unknown-unknown
      - cargo check --workspace --target x86_64-unknown-linux-gnu
      - cargo check --workspace --target x86_64-unknown-linux-musl
      - cargo check --workspace --target aarch64-unknown-linux-gnu
      - cargo check --workspace --target wasm32-unknown-unknown
